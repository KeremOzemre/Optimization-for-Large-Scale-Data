# Optional short comparison: 35000 updates x 4096 = 143360000 targets. Two-hour safety cap.
experiment:
  name: xl_full_equal_tokens_seed42
  seed: 42
  output_dir: runs/followups_equal_tokens_143m/xl_full_equal_tokens_seed42
data:
  dataset: roneneldan/TinyStories
  train_split: train
  heldout_split: validation
  test_ratio: 0.2
  train_stories: null
  validation_stories: null
  test_stories: null
  cache_dir: data/tokens-full
  preparation_seed: 42
tokenizer:
  name: gpt2
model:
  layers: 12
  width: 768
  heads: 12
  context_length: 256
  dropout: 0.1
training:
  device: cuda
  precision: bfloat16
  time_limit_seconds: 7200
  microbatch_size: 8
  gradient_accumulation_steps: 2
  log_interval_steps: 10
  max_steps: 35000
optimizer:
  learning_rate: 0.0003
  weight_decay: 0.1
  betas:
  - 0.9
  - 0.95
  gradient_clip: 1.0
schedule:
  warmup_fraction: 0.02
  min_lr_ratio: 0.1
  progress: steps
evaluation:
  interval_seconds: 300
  batches: 64
  microbatch_size: 4
  seed: 43
generation:
  prompt: Once upon a time
  max_new_tokens: 100
  temperature: 0.8
  top_k: 40
  seed: 101
