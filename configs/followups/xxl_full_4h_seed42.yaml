# Fresh four-hour run; not a checkpoint continuation.
experiment:
  name: xxl_full_4h_seed42
  seed: 42
  output_dir: runs/followups_4h/xxl_full_4h_seed42
data:
  dataset: roneneldan/TinyStories
  train_split: train
  heldout_split: validation
  test_ratio: 0.2
  train_stories: null
  validation_stories: null
  test_stories: null
  cache_dir: data/tokens-full
  preparation_seed: 42
tokenizer:
  name: gpt2
model:
  layers: 16
  width: 1024
  heads: 16
  context_length: 256
  dropout: 0.1
training:
  device: cuda
  precision: bfloat16
  time_limit_seconds: 14400
  microbatch_size: 4
  gradient_accumulation_steps: 4
  log_interval_steps: 10
  max_steps: null
optimizer:
  learning_rate: 0.0003
  weight_decay: 0.1
  betas:
  - 0.9
  - 0.95
  gradient_clip: 1.0
schedule:
  warmup_fraction: 0.02
  min_lr_ratio: 0.1
  progress: time
evaluation:
  interval_seconds: 300
  batches: 64
  microbatch_size: 4
  seed: 43
generation:
  prompt: Once upon a time
  max_new_tokens: 100
  temperature: 0.8
  top_k: 40
  seed: 101
